name: On push to main
on:
  push:
    branches: [main]

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MOMENTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOMENTO_RELEASE_APP_PRIVATE_KEY }}

      - name: Setup repo
        uses: actions/checkout@v3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate README
        uses: momentohq/standards-and-practices/github-actions/generate-and-commit-oss-readme@gh-actions-v2
        with:
          project_status: official
          project_stability: beta
          project_type: sdk
          sdk_language: Swift
          template_file: ./README.template.md
          output_file: ./README.md
          dev_docs_slug: swift
      
  test:
    needs: [readme]
    uses: ./.github/workflows/test.yml
    secrets:
      auth-token: ${{ secrets.ALPHA_TEST_AUTH_TOKEN }}
      api-key-v2: ${{ secrets.ALPHA_API_KEY_V2 }}

  publish:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MOMENTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOMENTO_RELEASE_APP_PRIVATE_KEY }}

      - uses: google-github-actions/release-please-action@v3
        name: Release Please
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: simple
          package-name: client-sdk-swift
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false}]'
          extra-files: |
            Sources/Momento/internal/utils/PackageVersion.swift

      - name: Publish
        run: |
          echo "Published version: ${{ steps.release.outputs.tag_name }}"
        if: ${{ steps.release.outputs.release_created }}
